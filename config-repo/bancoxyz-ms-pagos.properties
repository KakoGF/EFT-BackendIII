# ============================================================
# ms-pagos: Procesamiento de Pagos (depositos, retiros, transferencias y pagos)
# Coordina la saga: recibe la solicitud del BFF por Kafka, consulta la cuenta
# en ms-cuentas, pide la validacion y luego el ajuste del saldo.
# ============================================================

# Dos instancias para escalado horizontal (8098 y 8099). Kafka reparte las
# particiones de cada topico entre las instancias del mismo grupo.
server.port=${PUERTO:8098}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Base de datos propia (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${db.host}:${db.puerto}/bancoxyz_pagos
spring.datasource.username=${db.usuario}
spring.datasource.password=${db.clave}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Token de servicio hacia ms-cuentas (OAuth 2.0 Client Credentials) ---
spring.security.oauth2.client.registration.backend.client-id=ms-pagos
spring.security.oauth2.client.registration.backend.client-secret=MsPagos-2026
spring.security.oauth2.client.registration.backend.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.backend.scope=cuentas.leer
spring.security.oauth2.client.provider.backend.token-uri=${auth-server.url}/oauth2/token
servicios.timeout.conexion-ms=2000
servicios.timeout.lectura-ms=3000

# --- Tolerancia a fallos ---
# msCuentas: si ms-cuentas no responde, la solicitud sigue en modo conservador
# (validacion con limite reducido) y el saldo se revisa igual al aplicar.
resilience4j.circuitbreaker.instances.msCuentas.register-health-indicator=true
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-size=6
resilience4j.circuitbreaker.instances.msCuentas.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.msCuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msCuentas.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.msCuentas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msCuentas.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msCuentas.ignore-exceptions[0]=cl.duoc.bancoxyz.ms.pagos.exceptions.CuentaNoEncontradaException

resilience4j.circuitbreaker.instances.kafkaBroker.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-size=6
resilience4j.circuitbreaker.instances.kafkaBroker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaBroker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaBroker.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.kafkaBroker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaBroker.automatic-transition-from-open-to-half-open-enabled=true

spring.kafka.consumer.group-id=bancoxyz-ms-pagos

logging.level.cl.duoc.bancoxyz.ms=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.apache.kafka=WARN
