# ============================================================
# ms-clientes: Gestion de Clientes (datos personales y perfil)
# ============================================================

server.port=${PUERTO:8100}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --- Base de datos propia (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${db.host}:${db.puerto}/bancoxyz_clientes
spring.datasource.username=${db.usuario}
spring.datasource.password=${db.clave}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

datos-legacy.carga-inicial=${CARGA_INICIAL:true}

# --- Token de servicio hacia ms-cuentas (OAuth 2.0 Client Credentials) ---
spring.security.oauth2.client.registration.backend.client-id=ms-clientes
spring.security.oauth2.client.registration.backend.client-secret=MsClientes-2026
spring.security.oauth2.client.registration.backend.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.backend.scope=cuentas.leer
spring.security.oauth2.client.provider.backend.token-uri=${auth-server.url}/oauth2/token
servicios.timeout.conexion-ms=2000
servicios.timeout.lectura-ms=3000

# --- Tolerancia a fallos ---
# msCuentas: si ms-cuentas no responde, el perfil se entrega sin las cuentas.
resilience4j.circuitbreaker.instances.msCuentas.register-health-indicator=true
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-size=6
resilience4j.circuitbreaker.instances.msCuentas.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.msCuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msCuentas.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.msCuentas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msCuentas.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.ratelimiter.instances.msClientesApi.limit-for-period=20
resilience4j.ratelimiter.instances.msClientesApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.msClientesApi.timeout-duration=0s

# --- Kafka: consume las alertas de seguridad ---
spring.kafka.consumer.group-id=bancoxyz-ms-clientes

logging.level.cl.duoc.bancoxyz.ms=DEBUG
logging.level.org.apache.kafka=WARN
