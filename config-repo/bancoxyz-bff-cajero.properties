# ============================================================
# bff-cajero: canal Cajero
# Cajero automatico. Solo retiros, depositos y consulta de saldo
# ============================================================

server.port=8093

# --- HTTPS: el canal se expone con certificado (keystore PKCS12) ---
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=BancoXYZ-Cajero-2025
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-cajero

# --- Llamadas al backend: nombres logicos en Eureka (application.properties) ---
backend.timeout.conexion-ms=3000
backend.timeout.lectura-ms=5000

# --- Token de servicio hacia el backend (OAuth 2.0 Client Credentials) ---
spring.security.oauth2.client.registration.backend.client-id=bff-cajero
spring.security.oauth2.client.registration.backend.client-secret=BffCajero-2026
spring.security.oauth2.client.registration.backend.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.backend.scope=cuentas.leer,pagos.leer
spring.security.oauth2.client.provider.backend.token-uri=${auth-server.url}/oauth2/token

# --- Tolerancia a fallos (Resilience4j) ---
resilience4j.circuitbreaker.instances.msCuentas.register-health-indicator=true
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msCuentas.sliding-window-size=10
resilience4j.circuitbreaker.instances.msCuentas.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msCuentas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msCuentas.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.msCuentas.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msCuentas.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msCuentas.ignore-exceptions[0]=cl.duoc.bancoxyz.bff.cajero.exceptions.CuentaNoEncontradaException
resilience4j.circuitbreaker.instances.msCuentas.ignore-exceptions[1]=cl.duoc.bancoxyz.bff.cajero.exceptions.SolicitudRechazadaException

resilience4j.circuitbreaker.instances.msPagos.register-health-indicator=true
resilience4j.circuitbreaker.instances.msPagos.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.msPagos.sliding-window-size=10
resilience4j.circuitbreaker.instances.msPagos.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.msPagos.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.msPagos.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.msPagos.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.msPagos.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.msPagos.ignore-exceptions[0]=cl.duoc.bancoxyz.bff.cajero.exceptions.SolicitudRechazadaException

# Si falla la mitad de las ultimas 6 publicaciones en Kafka, el circuito se abre
# por 20 segundos y el fallback responde 503 NO_REGISTRADA sin hacer cargos.
resilience4j.circuitbreaker.instances.kafkaBroker.register-health-indicator=true
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.kafkaBroker.sliding-window-size=6
resilience4j.circuitbreaker.instances.kafkaBroker.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.kafkaBroker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.kafkaBroker.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.kafkaBroker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.kafkaBroker.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.kafkaBroker.ignore-exceptions[0]=cl.duoc.bancoxyz.bff.cajero.exceptions.SolicitudRechazadaException

# --- Seguridad OAuth 2.0: /bff/cajero/** exige un token con el scope canal.cajero ---

logging.level.cl.duoc.bancoxyz.bff=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.apache.kafka=WARN
