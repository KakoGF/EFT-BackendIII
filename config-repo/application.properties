# ============================================================
# Configuracion compartida por todos los microservicios
# Servida por el Config Server a cualquier cliente que la pida
# ============================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# --- Actuator: salud, metricas y estado de los mecanismos de resiliencia ---
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,ratelimiters
management.endpoint.health.show-details=when-authorized
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

# --- Base de datos (PostgreSQL) ---
# En local se usa localhost. En Docker el perfil "docker" cambia el host por
# el nombre del contenedor (postgres). Cada microservicio usa su propia base.
db.host=localhost
db.puerto=5432
db.usuario=bancoxyz
db.clave=bancoxyz

# --- Carpeta con los archivos legacy (fin_legacy_data/semana_3) ---
datos-legacy.dir=../datos-legacy

# ============================================================
# Mensajeria asincrona con Apache Kafka
# ============================================================

spring.kafka.bootstrap-servers=localhost:9092

# Productor: acks=all, el mensaje se confirma cuando las replicas en sincronia
# lo tienen. max.block.ms en 3 segundos para que, si Kafka esta caido, el envio
# falle rapido y actue el Circuit Breaker.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=3000

# Consumidor: si el grupo es nuevo, parte leyendo desde el primer mensaje
spring.kafka.consumer.auto-offset-reset=earliest

# Reintentos controlados: 3 reintentos cada 2 segundos. Si igual falla, el
# mensaje se mueve al topico <nombre>.DLT para no bloquear la particion.
kafka.consumidor.reintentos=3
kafka.consumidor.intervalo-ms=2000

# Topicos (la clave de cada mensaje es el numero de cuenta, para mantener el orden)
topicos.solicitudes-ingresadas=bancoxyz.solicitudes.ingresadas
topicos.transacciones-solicitadas=bancoxyz.transacciones.solicitadas
topicos.transacciones-validadas=bancoxyz.transacciones.validadas
topicos.cuentas-ajustes=bancoxyz.cuentas.ajustes
topicos.cuentas-ajustes-resultado=bancoxyz.cuentas.ajustes.resultado
topicos.transacciones-completadas=bancoxyz.transacciones.completadas
topicos.alertas-seguridad=bancoxyz.alertas.seguridad
topicos.cuentas-eventos=bancoxyz.cuentas.eventos

# ============================================================
# Seguridad con OAuth 2.0
# ============================================================

# Direccion del Servidor de Autorizacion. Todos descargan desde aqui la clave
# publica (/oauth2/jwks) para revisar la firma de cada token.
auth-server.url=http://localhost:9000
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${auth-server.url}/oauth2/jwks

# Nombres logicos en Eureka (balanceo de carga del lado del cliente)
ms-cuentas.service-id=bancoxyz-ms-cuentas
ms-pagos.service-id=bancoxyz-ms-pagos
ms-clientes.service-id=bancoxyz-ms-clientes
