# ============================================================
# auth-server: Servidor de Autorizacion OAuth 2.0
# Spring Authorization Server. Entrega los access token (JWT)
# que despues revisan los BFF y los microservicios.
# ============================================================

server.port=9000

# --- Usuario final (cliente del banco) para el flujo Authorization Code ---
# Es la persona que inicia sesion en la pagina de login del auth-server
# cuando usa la app Web o la app Movil.
seguridad.cliente.usuario=cliente
seguridad.cliente.clave=Cliente-2026

# ============================================================
# Clientes registrados
# Los client-secret se guardan cifrados con BCrypt: el auth-server
# nunca guarda la clave en texto plano, solo su hash.
# ============================================================

# --- app-web: la aplicacion web del banco (hay un usuario) ---
# Flujo Authorization Code: el cliente inicia sesion en el auth-server.
spring.security.oauth2.authorizationserver.client.app-web.registration.client-id=app-web
spring.security.oauth2.authorizationserver.client.app-web.registration.client-secret={bcrypt}$2a$10$Tb9T00CE5/C508FlrUEFh.EpH7xdDTF9xVaADgf7QDftToj28EkAu
spring.security.oauth2.authorizationserver.client.app-web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.app-web.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.app-web.registration.redirect-uris=https://oauth.pstmn.io/v1/callback
spring.security.oauth2.authorizationserver.client.app-web.registration.scopes=canal.web
spring.security.oauth2.authorizationserver.client.app-web.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.app-web.token.access-token-time-to-live=30m

# --- app-movil: la aplicacion movil del banco (hay un usuario) ---
spring.security.oauth2.authorizationserver.client.app-movil.registration.client-id=app-movil
spring.security.oauth2.authorizationserver.client.app-movil.registration.client-secret={bcrypt}$2a$10$Nxsgxm0ID/fQAztS5/I3qO/ErGlpKhr35a4nJTSxYEzlgLd.9f.eC
spring.security.oauth2.authorizationserver.client.app-movil.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.app-movil.registration.authorization-grant-types=authorization_code,refresh_token
spring.security.oauth2.authorizationserver.client.app-movil.registration.redirect-uris=https://oauth.pstmn.io/v1/callback
spring.security.oauth2.authorizationserver.client.app-movil.registration.scopes=canal.movil
spring.security.oauth2.authorizationserver.client.app-movil.require-authorization-consent=false
spring.security.oauth2.authorizationserver.client.app-movil.token.access-token-time-to-live=30m

# --- app-cajero: el cajero automatico (maquina, sin usuario) ---
# Flujo Client Credentials: se autentica solo con client-id y secret.
spring.security.oauth2.authorizationserver.client.app-cajero.registration.client-id=app-cajero
spring.security.oauth2.authorizationserver.client.app-cajero.registration.client-secret={bcrypt}$2a$10$9FE3h.8UMCLl1qa69arZR./IaURYWf665YQNJuzjwRT5gBuwBc7y2
spring.security.oauth2.authorizationserver.client.app-cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.app-cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.app-cajero.registration.scopes=canal.cajero
spring.security.oauth2.authorizationserver.client.app-cajero.token.access-token-time-to-live=30m

# --- bff-web / bff-movil / bff-cajero: servicio a servicio hacia el backend ---
# Cada BFF pide su propio token (Client Credentials) para consultar a los
# microservicios. Solo lectura: las operaciones viajan por Kafka.
spring.security.oauth2.authorizationserver.client.bff-web.registration.client-id=bff-web
spring.security.oauth2.authorizationserver.client.bff-web.registration.client-secret={bcrypt}$2a$10$Ilt40OHCOprzCNmPTy2LzuG1UJxtA2FXVBSrzHugMp92YggUy58.u
spring.security.oauth2.authorizationserver.client.bff-web.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-web.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bff-web.registration.scopes=cuentas.leer,pagos.leer,clientes.leer

spring.security.oauth2.authorizationserver.client.bff-movil.registration.client-id=bff-movil
spring.security.oauth2.authorizationserver.client.bff-movil.registration.client-secret={bcrypt}$2a$10$shsTxXGCsTCIw.MwjvvoTOSPbyx2pbHrYAWDsltkIMYeYkqPUmem2
spring.security.oauth2.authorizationserver.client.bff-movil.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-movil.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bff-movil.registration.scopes=cuentas.leer,pagos.leer

spring.security.oauth2.authorizationserver.client.bff-cajero.registration.client-id=bff-cajero
spring.security.oauth2.authorizationserver.client.bff-cajero.registration.client-secret={bcrypt}$2a$10$97OvVUrWQgpEkeuzjg5LTugdkZL0xKW2YMREycQzk3H97F5tRbjXO
spring.security.oauth2.authorizationserver.client.bff-cajero.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.bff-cajero.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.bff-cajero.registration.scopes=cuentas.leer,pagos.leer

# --- ms-pagos y ms-clientes: consultan a ms-cuentas con su propio token ---
spring.security.oauth2.authorizationserver.client.ms-pagos.registration.client-id=ms-pagos
spring.security.oauth2.authorizationserver.client.ms-pagos.registration.client-secret={bcrypt}$2a$10$9QFQoVqOrHIkTIK2M4JDreQC2UTMC6VtvMfkUCLQwWUfu4OgL6TTm
spring.security.oauth2.authorizationserver.client.ms-pagos.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.ms-pagos.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.ms-pagos.registration.scopes=cuentas.leer

spring.security.oauth2.authorizationserver.client.ms-clientes.registration.client-id=ms-clientes
spring.security.oauth2.authorizationserver.client.ms-clientes.registration.client-secret={bcrypt}$2a$10$9Qa8J6EzWFQrriVcX/.rx.hV/3vrf.AIvqcs5yb3E7hC29Vpr2WOK
spring.security.oauth2.authorizationserver.client.ms-clientes.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.ms-clientes.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.ms-clientes.registration.scopes=cuentas.leer

# --- app-backoffice: ejecutivo del banco (apertura, bloqueo y cierre de cuentas, datos de clientes) ---
spring.security.oauth2.authorizationserver.client.app-backoffice.registration.client-id=app-backoffice
spring.security.oauth2.authorizationserver.client.app-backoffice.registration.client-secret={bcrypt}$2a$10$eL4Ld3nGIjOkEkzC/9qj/e4EGTPR80WBRqN78bqV7fWHJtFbx.aXK
spring.security.oauth2.authorizationserver.client.app-backoffice.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.app-backoffice.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.app-backoffice.registration.scopes=cuentas.admin,cuentas.leer,clientes.admin,clientes.leer,pagos.leer
spring.security.oauth2.authorizationserver.client.app-backoffice.token.access-token-time-to-live=30m

# --- app-soporte: equipo de operaciones (monitoreo y pruebas de falla) ---
# Puede ver actuator, estadisticas, notificaciones y consultar los microservicios.
spring.security.oauth2.authorizationserver.client.app-soporte.registration.client-id=app-soporte
spring.security.oauth2.authorizationserver.client.app-soporte.registration.client-secret={bcrypt}$2a$10$.7HYvhIuRe3HaE7C6O8zYe/h83gq0raQoxXbLuWRCgAtPTb84KWQ6
spring.security.oauth2.authorizationserver.client.app-soporte.registration.client-authentication-methods=client_secret_basic
spring.security.oauth2.authorizationserver.client.app-soporte.registration.authorization-grant-types=client_credentials
spring.security.oauth2.authorizationserver.client.app-soporte.registration.scopes=soporte,cuentas.leer,pagos.leer,clientes.leer
spring.security.oauth2.authorizationserver.client.app-soporte.token.access-token-time-to-live=30m

logging.level.org.springframework.security=INFO
