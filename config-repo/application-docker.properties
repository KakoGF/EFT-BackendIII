# ============================================================
# Perfil "docker"
# Se activa con SPRING_PROFILES_ACTIVE=docker en docker-compose.yml.
# Dentro de Docker "localhost" es el propio contenedor, por eso cada
# servicio se busca por su nombre en la red de Docker Compose.
# ============================================================

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
# Cluster Kafka de 3 brokers: basta con que uno responda para conocer a los demas
spring.kafka.bootstrap-servers=kafka-1:29092,kafka-2:29092,kafka-3:29092
auth-server.url=http://auth-server:9000
db.host=postgres
datos-legacy.dir=/datos-legacy
