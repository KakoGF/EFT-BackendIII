name: bancoxyz

# ============================================================
# Banco XYZ - Evaluacion Final Transversal (Desarrollo Backend III)
#
# Levanta todo el sistema en una sola instancia EC2 de 8 GB:
#   - Kafka (3 brokers, replicacion 3) + Kafka UI
#   - PostgreSQL (una base de datos por microservicio)
#   - Spring Cloud: Config Server, Eureka y auth-server (OAuth 2.0)
#   - Microservicios de negocio: ms-cuentas (x2), ms-pagos (x2), ms-clientes
#   - Apoyo: ms-validaciones (x2) y ms-notificaciones
#   - Backend for Frontend: bff-web, bff-movil, bff-cajero (HTTPS)
#   - batch-service: los 3 Jobs de Spring Batch, se ejecuta bajo demanda
#
# Las imagenes se construyen con Docker multi-stage: la etapa 1 compila el
# proyecto con Maven dentro del contenedor y la etapa 2 deja solo el .jar sobre
# un JRE liviano. No se necesita Maven ni Java instalados en el equipo.
#   (construir las imagenes una por una con docker compose build <servicio>)
#   docker compose up -d
#   docker compose --profile batch run --rm batch-service --spring.batch.job.name=jobReporteTransaccionesDiarias
# ============================================================

services:

  # ---------------- Cluster Kafka: 3 brokers, 3 particiones, replicacion 3 ----------------

  kafka-1:
    image: apache/kafka:3.8.0
    container_name: bancoxyz-kafka-1
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms320m -Xmx320m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
    restart: on-failure

  kafka-2:
    image: apache/kafka:3.8.0
    container_name: bancoxyz-kafka-2
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-2:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms320m -Xmx320m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
    restart: on-failure

  kafka-3:
    image: apache/kafka:3.8.0
    container_name: bancoxyz-kafka-3
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka-3:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms320m -Xmx320m"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 20
    restart: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: bancoxyz-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bancoxyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xmx192m"
    mem_limit: 384m
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    restart: on-failure

  # ---------------- Base de datos ----------------
  # Un solo contenedor PostgreSQL con 4 bases: bancoxyz_cuentas, bancoxyz_pagos,
  # bancoxyz_clientes y bancoxyz_batch. El volumen mantiene los datos aunque
  # se reinicien los contenedores.

  postgres:
    image: postgres:16-alpine
    container_name: bancoxyz-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bancoxyz
      POSTGRES_PASSWORD: bancoxyz
      POSTGRES_DB: bancoxyz
    volumes:
      - bancoxyz_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bancoxyz -d bancoxyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure

  # ---------------- Spring Cloud: configuracion, registro y seguridad ----------------

  config-server:
    build: ./config-server
    image: bancoxyz/config-server:1.0
    container_name: bancoxyz-config-server
    ports:
      - "8888:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: file:/config-repo
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    volumes:
      - ./config-repo:/config-repo:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure

  eureka-server:
    build: ./eureka-server
    image: bancoxyz/eureka-server:1.0
    container_name: bancoxyz-eureka-server
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure

  auth-server:
    build: ./auth-server
    image: bancoxyz/auth-server:1.0
    container_name: bancoxyz-auth-server
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # ---------------- Microservicios de negocio ----------------

  # Gestion de Cuentas. La instancia 1 hace la carga inicial desde los archivos legacy.
  ms-cuentas-1:
    build: ./ms-cuentas
    image: bancoxyz/ms-cuentas:1.0
    container_name: bancoxyz-ms-cuentas-1
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8090
      CARGA_INICIAL: "true"
    volumes:
      - ./datos-legacy:/datos-legacy:ro
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # Segunda instancia de la misma imagen (escalado horizontal). Los BFF, ms-pagos y
  # ms-clientes la encuentran en Eureka y reparten las llamadas entre las dos.
  ms-cuentas-2:
    build: ./ms-cuentas
    image: bancoxyz/ms-cuentas:1.0
    container_name: bancoxyz-ms-cuentas-2
    ports:
      - "8097:8097"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8097
      CARGA_INICIAL: "false"
    volumes:
      - ./datos-legacy:/datos-legacy:ro
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8097/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # Procesamiento de Pagos. Dos instancias en el mismo grupo de consumidores Kafka.
  # La segunda espera a la primera para que no creen las tablas al mismo tiempo.
  ms-pagos-1:
    build: ./ms-pagos
    image: bancoxyz/ms-pagos:1.0
    container_name: bancoxyz-ms-pagos-1
    ports:
      - "8098:8098"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8098
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8098/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  ms-pagos-2:
    build: ./ms-pagos
    image: bancoxyz/ms-pagos:1.0
    container_name: bancoxyz-ms-pagos-2
    ports:
      - "8099:8099"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8099
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
      ms-pagos-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8099/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # Gestion de Clientes.
  ms-clientes:
    build: ./ms-clientes
    image: bancoxyz/ms-clientes:1.0
    container_name: bancoxyz-ms-clientes
    ports:
      - "8100:8100"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8100
      CARGA_INICIAL: "true"
    volumes:
      - ./datos-legacy:/datos-legacy:ro
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8100/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # ---------------- Microservicios de apoyo ----------------

  # Reglas del banco y antifraude. Dos instancias que se reparten las particiones.
  ms-validaciones-1:
    build: ./ms-validaciones
    image: bancoxyz/ms-validaciones:1.0
    container_name: bancoxyz-ms-validaciones-1
    ports:
      - "8094:8094"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8094
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8094/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  ms-validaciones-2:
    build: ./ms-validaciones
    image: bancoxyz/ms-validaciones:1.0
    container_name: bancoxyz-ms-validaciones-2
    ports:
      - "8095:8095"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      PUERTO: 8095
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8095/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  ms-notificaciones:
    build: ./ms-notificaciones
    image: bancoxyz/ms-notificaciones:1.0
    container_name: bancoxyz-ms-notificaciones
    ports:
      - "8096:8096"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8096/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # ---------------- Backend for Frontend (HTTPS, un BFF por canal, productores Kafka) ----------------

  bff-web:
    build: ./bff-web
    image: bancoxyz/bff-web:1.0
    container_name: bancoxyz-bff-web
    ports:
      - "8091:8091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
      ms-pagos-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      ms-clientes:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8091 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  bff-movil:
    build: ./bff-movil
    image: bancoxyz/bff-movil:1.0
    container_name: bancoxyz-bff-movil
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
      ms-pagos-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  bff-cajero:
    build: ./bff-cajero
    image: bancoxyz/bff-cajero:1.0
    container_name: bancoxyz-bff-cajero
    ports:
      - "8093:8093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      JAVA_TOOL_OPTIONS: "-Xmx200m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    mem_limit: 512m
    depends_on:
      auth-server:
        condition: service_healthy
      ms-cuentas-1:
        condition: service_healthy
      ms-pagos-1:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8093 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: on-failure

  # ---------------- Procesos batch (Spring Batch) ----------------
  # No se levanta con "docker compose up": se ejecuta un job a la vez y el
  # contenedor termina cuando el job finaliza.
  #   docker compose --profile batch run --rm batch-service --spring.batch.job.name=jobCalculoInteresesMensuales

  batch-service:
    build: ./batch-service
    image: bancoxyz/batch-service:1.0
    container_name: bancoxyz-batch-service
    profiles: ["batch"]
    environment:
      DB_HOST: postgres
      DB_NAME: bancoxyz_batch
      APP_BATCH_DATA_DIR: /datos-legacy
      JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseSerialGC"
    volumes:
      - ./datos-legacy:/datos-legacy:ro
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  bancoxyz_pgdata:
