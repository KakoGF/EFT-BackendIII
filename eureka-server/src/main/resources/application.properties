spring.application.name=bancoxyz-eureka-server
server.port=8761

# El servidor de registro no se registra en si mismo ni consulta otro registro.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Auto-preservacion desactivada y desalojo rapido: en un entorno local de
# desarrollo conviene que un servicio caido desaparezca del registro en
# segundos, para poder evidenciar el comportamiento del Circuit Breaker.
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000

logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
