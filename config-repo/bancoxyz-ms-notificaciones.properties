# ============================================================
# ms-notificaciones: avisos al cliente (consume transacciones completadas,
# alertas de seguridad y eventos de cuenta)
# ============================================================

server.port=8096

spring.kafka.consumer.group-id=bancoxyz-ms-notificaciones

# --- Tolerancia a fallos hacia el proveedor externo de correo/SMS ---
resilience4j.circuitbreaker.instances.proveedorNotificaciones.register-health-indicator=true
resilience4j.circuitbreaker.instances.proveedorNotificaciones.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.proveedorNotificaciones.sliding-window-size=6
resilience4j.circuitbreaker.instances.proveedorNotificaciones.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.proveedorNotificaciones.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.proveedorNotificaciones.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.proveedorNotificaciones.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.proveedorNotificaciones.automatic-transition-from-open-to-half-open-enabled=true

# --- Monitoreo del Dead Letter Topic (DLT) ---
# Cuando un consumidor falla 3 veces con el mismo mensaje, este se mueve a <topico>.DLT.
# ms-notificaciones escucha los 8 topicos .DLT, avisa a soporte por cada mensaje y,
# si llegan 3 o mas en 5 minutos, levanta una ALERTA CRITICA.
dlt.alerta.umbral=3
dlt.alerta.ventana-segundos=300

# --- Seguridad OAuth 2.0: /notificaciones/** exige el scope soporte ---

logging.level.cl.duoc.bancoxyz.ms=DEBUG
logging.level.io.github.resilience4j=DEBUG
logging.level.org.apache.kafka=WARN
